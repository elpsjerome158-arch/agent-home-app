<style>
:root{--cyan:#2DD4FF;--pink:#FF3B7A;--mag:#E040FB;--bg:#05060b;--glow:var(--cyan);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#E9ECF2;overflow:hidden;overscroll-behavior:none;
  font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage{position:fixed;inset:0;height:100dvh;touch-action:none;background:radial-gradient(120% 90% at 50% 35%,#0b1020 0%,#05060b 70%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .8s}
#stage.live #gl{opacity:1}
/* still-image fallback / poster */
#still{position:absolute;left:50%;top:6%;width:min(100vw,66dvh);aspect-ratio:1;transform:translateX(-50%);transition:opacity .8s;pointer-events:none}
#still img{width:100%;height:100%;display:block;object-fit:cover;border-radius:18px;animation:breathe 5s ease-in-out infinite;-webkit-mask-image:radial-gradient(closest-side,#000 78%,transparent 100%);mask-image:radial-gradient(closest-side,#000 78%,transparent 100%)}
#stage.live #still{opacity:0}
#visorGlow{position:absolute;left:46.8%;top:33%;width:34%;height:30%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--glow) 55%,transparent),transparent 75%);mix-blend-mode:screen;opacity:.45;animation:pulse 2.6s ease-in-out infinite}
#stage.talking #visorGlow{animation:none;opacity:.85}
@keyframes breathe{50%{transform:scale(1.02) translateY(-1%)}}
@keyframes pulse{50%{opacity:.8}}
/* scanline + vignette */
#scan{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
#scan::after{content:"";position:absolute;left:0;right:0;height:22%;top:-25%;background:linear-gradient(180deg,transparent,rgba(45,212,255,.07),transparent);animation:sweep 7s linear infinite}
@keyframes sweep{to{top:110%}}
#vig{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(120% 100% at 50% 40%,transparent 55%,rgba(0,0,0,.65) 100%)}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(var(--sat) + 10px) 14px 0;display:flex;gap:10px;justify-content:space-between;pointer-events:none}
.panel{background:rgba(8,12,20,.62);border:1px solid color-mix(in srgb,var(--glow) 55%,transparent);border-radius:10px;padding:7px 10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:0 0 14px color-mix(in srgb,var(--glow) 25%,transparent)}
#hudL{min-width:150px}
#hudL b{letter-spacing:.2em;color:var(--glow);font-size:14px}
#hudL .st{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:11px}
#dot{width:8px;height:8px;border-radius:50%;background:var(--glow);box-shadow:0 0 8px var(--glow);animation:pulse 2s infinite}
#hudL .row{color:#9aa6bd;font-size:10.5px;white-space:nowrap}
#hudL .row i{font-style:normal;color:#E9ECF2}
#hudR{display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid color-mix(in srgb,var(--glow) 55%,transparent);background:rgba(8,12,20,.62);color:var(--glow);font-size:17px;display:grid;place-items:center;text-decoration:none;cursor:pointer;padding:0}
.ib[aria-pressed=true]{color:#667}
/* bottom dock */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 12px calc(var(--sab) + 10px);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#bubble{pointer-events:auto;max-width:min(94vw,520px);width:100%;min-height:0;display:none}
#bubble.show{display:block}
#bubble .panel{font-size:14px;line-height:1.4;color:#EAF7FF}
#bubble .who{display:block;font-size:10px;letter-spacing:.2em;color:var(--glow);margin-bottom:3px}
#bubble .acts{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;color:#05060b;background:var(--glow);border:0;border-radius:999px;padding:7px 14px;font-weight:700;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--glow);border:1px solid var(--glow)}
#wave{width:min(94vw,520px);height:34px;display:block;opacity:.9}
#bar{pointer-events:auto;display:flex;gap:8px;width:min(94vw,520px);align-items:center}
#q{flex:1;min-width:0;height:44px;border-radius:22px;border:1px solid color-mix(in srgb,var(--glow) 55%,transparent);background:rgba(8,12,20,.7);color:#EAF7FF;padding:0 16px;font:16px ui-monospace,Menlo,monospace;outline:none;-webkit-user-select:text;user-select:text}
#q::placeholder{color:#6f7a90}
#mic{width:64px;height:64px;border-radius:50%;border:2px solid var(--glow);background:radial-gradient(circle,color-mix(in srgb,var(--glow) 30%,#05060b),#05060b);color:var(--glow);font-size:26px;display:grid;place-items:center;flex:none;touch-action:none;cursor:pointer;padding:0;
  box-shadow:0 0 18px color-mix(in srgb,var(--glow) 40%,transparent);-webkit-user-select:none}
#mic.rec{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 0 28px var(--pink);transform:scale(1.1)}
#send{height:44px;padding:0 14px;flex:none}
#wake{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 158px);text-align:center;z-index:6;pointer-events:none;letter-spacing:.25em;font-size:12px;color:var(--glow);text-shadow:0 0 10px var(--glow);animation:pulse 1.6s infinite}
#wake.hide{display:none}
#hint{font-size:10.5px;color:#6f7a90;text-align:center;pointer-events:none;letter-spacing:.04em}
@media (prefers-reduced-motion:reduce){#scan::after,#still img,#dot,#wake{animation:none}}
@media (min-width:700px){#hud{padding-left:24px;padding-right:24px}}
</style>

<body>
<div id="stage" aria-label="Zero, 3D avatar">
  <div id="still"><img src="zero-avatar-sq.jpg" alt="Zero: black space-suit figure with a neon skull in the visor" decoding="async"><div id="visorGlow"></div></div>
  <canvas id="gl"></canvas>
</div>
<div id="vig"></div><div id="scan"></div>

<div id="hud">
  <div id="hudL" class="panel">
    <b>ZERO</b>
    <div class="st"><span id="dot"></span><span id="stText">LINKING…</span></div>
    <div class="row">notes <i id="hNotes">--</i> · open <i id="hOpen">--</i></div>
    <div class="row">agents <i id="hAgents">--</i> · data <i id="hAge">--</i></div>
  </div>
  <div id="hudR">
    <button class="ib" id="mute" aria-label="Mute voice" aria-pressed="false">🔊</button>
    <a class="ib" id="appLink" href="./" aria-label="Open Agent Home">⌂</a>
  </div>
</div>

<div id="wake">TAP TO WAKE ZERO</div>
<div id="dock">
  <div id="bubble" aria-live="polite"></div>
  <canvas id="wave" width="520" height="34"></canvas>
  <div id="bar">
    <input id="q" type="text" enterkeyhint="send" autocomplete="off" autocorrect="off" autocapitalize="sentences" placeholder="Ask Zero…" aria-label="Ask Zero">
    <button class="btn" id="send">Send</button>
    <button id="mic" aria-label="Hold to talk">🎙</button>
  </div>
  <div id="hint">hold 🎙 to talk · or type · drag to spin · pinch to zoom</div>
</div>

<script>
/* ============================================================
   ZERO — standalone 3D avatar + voice. Public data only.
   Reads: brain-widget.json (same folder) and live.json (agent-home-web) and gem-x.json (X Radar).
   No private files, no accounts, no P&L, no trading. Nothing is ever sent anywhere from this page.
   ============================================================ */
"use strict";
const BASE = new URL("./", location.href).href;
const URL_BW = BASE + "brain-widget.json";
const URL_GX = BASE + "gem-x.json";
const URL_LIVE = "https://elpsjerome158-arch.github.io/agent-home-web/StreamingAssets/AgentHome/live.json";
const $ = (id) => document.getElementById(id);
const stage = $("stage");
const DAY = 86400;

/* ---------- shared state (read by the 3D loop) ---------- */
const Z = { talk: 0, speaking: false, pulse: 0, expr: "neutral", stale: false, fresh: true, woke: false, muted: false,
            data: null, intent: null, onExpr: null, onState: null, simTalkUntil: 0 };

/* ---------- data (public only) ---------- */
async function getJSON(u) {
  try { const r = await fetch(u + (u.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" }); if (!r.ok) throw 0; return await r.json(); }
  catch (e) { return null; }
}
const num = (x) => (Number.isFinite(+x) && x !== null ? +x : 0);
function ageSec(iso, ts) {
  if (ts) return Math.max(0, Date.now() / 1000 - ts);
  const t = Date.parse(iso || ""); return Number.isFinite(t) ? Math.max(0, (Date.now() - t) / 1000) : null;
}
function ageWords(s) {
  if (s == null) return "unknown age";
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + " minutes";
  if (s < DAY) { const h = Math.round(s / 3600); return h + (h === 1 ? " hour" : " hours"); }
  const d = Math.round(s / DAY); return d + (d === 1 ? " day" : " days");
}
function ageShort(s) { if (s == null) return "--"; return s < 3600 ? Math.max(1, Math.round(s / 60)) + "m" : s < DAY ? Math.round(s / 3600) + "h" : Math.round(s / DAY) + "d"; }
const PRETTY = { "perps-market-scout": "Market Scout", "trade-journal-bot": "Trade Journal", "wallet-watch": "Wallet Watch", "gem-search": "Gem Search" };
const prettyId = (id) => PRETTY[id] || String(id || "agent").replace(/[-_]+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());

function summarize(bw, live, gx) {
  const sb = (bw && bw.second_brain) || {}, pl = (bw && bw.pipeline) || {}, nr = (bw && bw.neural) || {};
  const lines = (live && Array.isArray(live.agent_status_lines)) ? live.agent_status_lines : [];
  const finds = (gx && Array.isArray(gx.finds)) ? gx.finds.slice() : [];
  finds.sort((a, b) => num(b.score) - num(a.score) || num(b.mentions) - num(a.mentions));
  const liveAge = ageSec(live && live.updated_iso);
  const brainAge = ageSec(null, nr.newest_ts || sb.newest_ts);
  const gxAge = ageSec(gx && gx.scanned_at_iso);
  const ages = [liveAge, brainAge].filter((x) => x != null);
  const dataAge = live ? liveAge : (ages.length ? Math.min.apply(null, ages) : null); // freshness is driven by the live feed
  return {
    ok: !!(bw || live || gx), haveBW: !!bw, haveLive: !!live, haveGX: !!gx,
    notes: num(sb.notes), folders: num(sb.folders), links: num(sb.links), topics: num(sb.topics), attention: num(sb.attention), rules: num(sb.rules),
    nodes: num(nr.nodes), agentsGraph: num(nr.agents), memory: num(nr.memory),
    open: num(pl.open), decided: num(pl.decided), decisions: num(pl.decisions), gate: pl.gate == null ? null : num(pl.gate), gapS: pl.median_gap_s == null ? null : num(pl.median_gap_s),
    questions: num(pl.questions), cases: Array.isArray(pl.cases) ? pl.cases.length : 0,
    agents: lines.length, agentsLive: lines.filter((l) => l && l.line && l.line !== "private").length,
    agentNames: lines.filter((l) => l && l.line && l.line !== "private").map((l) => prettyId(l.id)),
    finds: finds.slice(0, 5).map((f) => ({ ticker: String(f.ticker || "").replace(/[^A-Za-z0-9$]/g, "").slice(0, 12), score: num(f.score), mentions: num(f.mentions), authors: num(f.authors) })).filter((f) => f.ticker),
    gxAge, liveAge, brainAge, dataAge,
    stale: dataAge == null ? true : dataAge > DAY,
  };
}
let dataPromise = null;
async function loadData() {
  const [bw, live, gx] = await Promise.all([getJSON(URL_BW), getJSON(URL_LIVE), getJSON(URL_GX)]);
  const d = summarize(bw, live, gx);
  if (d.ok) { try { localStorage.setItem("zero.cache.v1", JSON.stringify({ bw, live: live && { updated_iso: live.updated_iso, agent_status_lines: live.agent_status_lines }, gx: gx && { scanned_at_iso: gx.scanned_at_iso, finds: gx.finds && gx.finds.slice(0, 8).map((f) => ({ ticker: f.ticker, score: f.score, mentions: f.mentions, authors: f.authors })) } })); } catch (e) {} }
  else { try { const c = JSON.parse(localStorage.getItem("zero.cache.v1") || "null"); if (c) { const dd = summarize(c.bw, c.live, c.gx); dd.cached = true; return dd; } } catch (e) {} }
  return d;
}
function applyData(d) {
  Z.data = d; Z.stale = !!d.stale; Z.fresh = d.ok && !d.stale;
  const root = document.documentElement.style;
  root.setProperty("--glow", Z.stale || !d.ok ? "#FF3B7A" : "#2DD4FF");
  $("stText").textContent = !d.ok ? "OFFLINE" : (Z.stale ? "STALE · " + ageShort(d.dataAge) : "ONLINE") + (d.cached ? " · cached" : "");
  $("hNotes").textContent = d.haveBW || d.cached ? d.notes : "--"; $("hOpen").textContent = d.haveBW || d.cached ? d.open : "--";
  $("hAgents").textContent = d.agents || "--"; $("hAge").textContent = ageShort(d.dataAge);
  if (Z.onState) Z.onState();
}
function refresh() { dataPromise = loadData().then((d) => { applyData(d); return d; }); return dataPromise; }

/* ---------- voice out ---------- */
const synth = ("speechSynthesis" in window) ? window.speechSynthesis : null;
let voice = null;
function pickVoice() {
  if (!synth) return;
  const vs = synth.getVoices().filter((v) => /^en/i.test(v.lang));
  if (!vs.length) return;
  const prefs = [/daniel/i, /arthur/i, /aaron/i, /rishi/i, /oliver/i, /gordon/i, /fred/i, /alex/i, /google uk english male/i, /\bmale\b/i, /david|mark|james|george|guy|ryan|thomas/i];
  for (const p of prefs) { const v = vs.find((x) => p.test(x.name)); if (v) { voice = v; return; } }
  voice = vs.find((v) => /en-GB/i.test(v.lang)) || vs.find((v) => /en-US/i.test(v.lang)) || vs[0];
}
if (synth) { pickVoice(); try { synth.addEventListener("voiceschanged", pickVoice); } catch (e) { synth.onvoiceschanged = pickVoice; } }

let speakTok = 0;
function sentences(t) { return (t.match(/[^.!?]+[.!?]*/g) || [t]).map((s) => s.trim()).filter(Boolean); }
function setExpr(e) { Z.expr = e || "neutral"; if (Z.onExpr) Z.onExpr(Z.expr); }
function speakText(text, expr, opts) {
  opts = opts || {};
  const tok = ++speakTok;
  setExpr(expr);
  if (!opts.noBubble) bubble(text, opts.actions);
  const start = () => { Z.speaking = true; stage.classList.add("talking"); };
  const stop = () => { if (tok === speakTok) { Z.speaking = false; stage.classList.remove("talking"); Z.pulse = 0; } };
  if (!synth || Z.muted || !Z.woke) {            // silent mode: still animate the jaw for roughly the reading time
    Z.simTalkUntil = performance.now() + Math.min(9000, text.length * 55); start();
    setTimeout(() => { if (tok === speakTok && performance.now() >= Z.simTalkUntil - 50) stop(); }, Math.min(9000, text.length * 55) + 60);
    return;
  }
  try { synth.cancel(); } catch (e) {}
  const parts = sentences(text);
  parts.forEach((s, i) => {
    const u = new SpeechSynthesisUtterance(s);
    if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = "en-GB";
    u.pitch = 0.62; u.rate = 0.96; u.volume = 1;
    u.onstart = () => { if (tok === speakTok) start(); };
    u.onboundary = (ev) => { if (tok === speakTok && (!ev.name || ev.name === "word")) Z.pulse = 1; };
    u.onend = () => { if (i === parts.length - 1) stop(); };
    u.onerror = () => { if (i === parts.length - 1) stop(); };
    synth.speak(u);
  });
  Z.simTalkUntil = performance.now() + 400; // covers the gap before onstart; real speech keeps `speaking` true
  start();
  setTimeout(() => { if (tok === speakTok && synth && !synth.speaking && !synth.pending) stop(); }, 1500);
}
/* unlock iOS audio inside a user gesture */
function unlockAudio() {
  if (Z.woke) return;
  Z.woke = true; $("wake").classList.add("hide");
  if (synth) { try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; synth.speak(u); } catch (e) {} }
}

/* ---------- bubble ---------- */
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function bubble(text, actions) {
  const b = $("bubble"); b.classList.add("show");
  b.innerHTML = '<div class="panel"><span class="who">ZERO</span>' + esc(text) + '<div class="acts"></div></div>';
  const acts = b.querySelector(".acts");
  (actions || []).forEach((a) => {
    const el = document.createElement(a.href ? "a" : "button");
    el.className = "btn" + (a.ghost ? " ghost" : ""); el.textContent = a.label;
    if (a.href) { el.href = a.href; } else el.addEventListener("click", a.fn);
    acts.appendChild(el);
  });
  if (!actions || !actions.length) acts.remove();
}
function userBubble(t) { /* echo of what Zero heard goes in the input placeholder to keep the dock small */ $("q").value = ""; $("q").placeholder = "“" + t.slice(0, 60) + "”"; }

/* ---------- greeting ---------- */
function daypart() { const h = new Date().getHours(); return h < 5 ? "Late night" : h < 12 ? "Morning" : h < 17 ? "Afternoon" : "Evening"; }
function radarPhrase(d) {
  if (!d.haveGX) return "X Radar is unreachable";
  return d.gxAge > DAY ? "X Radar is " + ageWords(d.gxAge) + " stale" : "X Radar is fresh, scanned " + ageWords(d.gxAge) + " ago";
}
function greetingText(d) {
  const head = daypart() + ", Jerome. Zero online.";
  if (!d || !d.ok) return head + " I can't reach my data feeds right now.";
  const bits = [];
  if (d.haveLive) bits.push(d.agents + " agents online");
  if (d.haveGX) bits.push(radarPhrase(d));
  else if (d.haveBW) bits.push(d.notes + " notes in the second brain");
  return head + (bits.length ? " " + bits.join(", ") + "." : "");
}
let greeted = false;
function greet() {
  if (greeted) return; greeted = true;
  unlockAudio();
  const d = Z.data;
  if (d) { speakText(greetingText(d), Z.stale ? "sleepy" : "happy"); return; }
  speakText("Zero online.", "neutral");                      // inside the gesture; the details follow when data lands
  (dataPromise || refresh()).then((dd) => { setTimeout(() => speakText(greetingText(dd), Z.stale ? "sleepy" : "happy"), 900); });
}

/* ---------- local intents (public data only) ---------- */
const JOKES = [
  "Why did the skull stay calm in the visor? It had nothing to lose, only bones to pick.",
  "I tried to tell a UDP joke. I'm not sure you got it.",
  "There are ten kinds of people: those who read binary and those who don't. I only read zeros, obviously.",
  "I'm an astronaut with a skull for a face. Honestly, it's still better than most stand-up crews.",
  "Why do agents never get lost? They always have a good routing table.",
  "A byte walks into a bar and says, make mine a double. Bartender says, you're already eight.",
  "Space is great, but there's no atmosphere. Also no Wi-Fi. Zero bars, as promised.",
];
let jokeI = Math.floor(Math.random() * JOKES.length);
let pending = null; // an unanswered question awaiting the user's yes/no
const R = (text, expr, extra) => Object.assign({ text, expr: expr || "neutral" }, extra || {});

function answer(raw) {
  const t = " " + raw.toLowerCase().replace(/[^a-z0-9$%&?' ]+/g, " ").replace(/\s+/g, " ").trim() + " ";
  const has = (re) => re.test(t);
  const d = Z.data;
  const nodata = () => R("I can't reach my data feeds right now. Try again in a moment.", "think");

  if (has(/ (p&l|pnl|profit|loss|balance|account|wallet|position|positions|holdings|portfolio|net worth|robinhood|password|passcode|bank|card) /))
    return R("That's private. I only read public data: counts, status and the X Radar. No money, accounts or contacts.", "alert");
  if (has(/ (buy|sell|place an order|place a trade|execute|trade for me|make a trade|short it|go long) /))
    return R("I can't place trades. I'm research only, and nothing I do here touches an order.", "alert");

  if (has(/ (joke|funny|make me laugh|laugh) /)) { const j = JOKES[jokeI++ % JOKES.length]; return R(j, "joke"); }
  if (has(/ (who are you|your name|what are you|who is zero) /)) return R("I'm Zero, the face of your Brain agent. Black suit, neon skull, public data only.", "happy");
  if (has(/ (thanks|thank you|cheers|nice one|good job|well done) /)) return R("Anytime, Jerome.", "happy");
  if (has(/ (how are you|how.s it going|how do you feel|you ok|you okay) /)) return R(Z.stale ? "A little sleepy. My data is stale, but I'm running." : "Running clean and glowing cyan. Thanks for asking.", Z.stale ? "sleepy" : "happy");
  if (has(/ (hello|hi|hey|yo|good morning|good evening|good afternoon|sup) /) && t.trim().split(" ").length <= 4) return R(daypart() + ", Jerome. Zero here. What do you need?", "happy");
  if (has(/ (bye|goodbye|see you|goodnight|good night|later) /)) return R("Signing off. I'll keep the visor lit.", "sleepy");

function handle(raw) {
  raw = (raw || "").trim().slice(0, 240);
  if (!raw) return;
  userBubble(raw);
  unlockAudio();
  const low = " " + raw.toLowerCase().replace(/[^a-z ]+/g, "").trim() + " ";
  if (pending) {
    if (/ (yes|yeah|yep|sure|ok|okay|do it|please|go ahead|confirm) /.test(low)) return confirmAsk();
    if (/ (no|nope|nah|cancel|never mind|nevermind|don.t|dont) /.test(low)) { pending = null; return speakText("Okay, dropped it.", "neutral"); }
    pending = null;

  const a = (dataPromise && !Z.data) ? null : answer(raw);
  if (a === null && !Z.data && dataPromise) { dataPromise.then(() => handle(raw)); return; }
  if (a) { speakText(a.text, a.expr); return; }

    actions: [{ label: "Yes", fn: () => confirmAsk() }, { label: "No", ghost: true, fn: () => { pending = null; speakText("Okay, dropped it.", "neutral"); } }],

}

}

  const ts = (lon, lat) => new T.Vector3(TR.x * Math.cos(lat) * Math.sin(lon), TC.y + TR.y * Math.sin(lat), TR.z * Math.cos(lat) * Math.cos(lon)).multiplyScalar(1.02).add(new T.Vector3(0, TC.y * -0.02, 0));
  for (const s of [-1, 1]) {

    const padRing = new T.Mesh(new T.TorusGeometry(0.55, 0.018, 8, 40), s < 0 ? neonC : neonP); padRing.scale.set(1, 0.85, 1); padRing.position.set(s * 1.52, -0.38, -0.02); padRing.rotation.set(0, s * Math.PI / 2.4, 0); chest.add(padRing);
    chest.add(tube(line((l) => ts(s * l, 0.62), 0.25, 1.1, 18), s < 0 ? neonC : neonP, 0.022));

  }
  chest.add(tube(line((l) => ts(l, -0.4), -1.0, 1.0, 26), neonP, 0.02));
  // chest badge ("ZERO")
  const bC = document.createElement("canvas"); bC.width = 512; bC.height = 180; const bx = bC.getContext("2d");
  bx.fillStyle = "#050c14"; bx.fillRect(0, 0, 512, 180);
  const gr = bx.createLinearGradient(0, 0, 512, 0); gr.addColorStop(0, "#2dd4ff"); gr.addColorStop(.5, "#2dd4ff"); gr.addColorStop(.55, "#ff3b7a"); gr.addColorStop(1, "#ff3b7a");
  bx.strokeStyle = gr; bx.lineWidth = 10; bx.shadowColor = "#2dd4ff"; bx.shadowBlur = 16; bx.beginPath(); bx.moveTo(30, 8); bx.lineTo(482, 8); bx.lineTo(504, 30); bx.lineTo(504, 150); bx.lineTo(482, 172); bx.lineTo(30, 172); bx.lineTo(8, 150); bx.lineTo(8, 30); bx.closePath(); bx.stroke();
  bx.font = "italic 800 104px 'Exo 2','Arial Black',system-ui,sans-serif"; bx.textAlign = "center"; bx.textBaseline = "middle"; bx.fillStyle = "#e6fbff"; bx.shadowColor = "#2dd4ff"; bx.shadowBlur = 22; bx.fillText("ZERO", 256, 94);
  const bT = new T.CanvasTexture(bC); bT.colorSpace = T.SRGBColorSpace;
  const badge = new T.Mesh(new T.PlaneGeometry(0.78, 0.274), new T.MeshBasicMaterial({ map: bT, toneMapped: false }));
  badge.position.set(0, -0.62, 0.965); badge.rotation.x = -0.3; chest.add(badge);

  // holographic HUD rings
  const ringTex = (() => {
    const c = document.createElement("canvas"); c.width = c.height = 1024; const x = c.getContext("2d"); x.translate(512, 512); x.lineCap = "round"; x.shadowBlur = 14;
    const arc = (r, a0, a1, w, col) => { x.strokeStyle = col; x.shadowColor = col; x.lineWidth = w; x.beginPath(); x.arc(0, 0, r, a0, a1); x.stroke(); };
    for (let i = 0; i < 4; i++) arc(470, i * Math.PI / 2 + 0.12, i * Math.PI / 2 + 1.3, 6, i % 2 ? "#ff3b7a" : "#2dd4ff");
    for (let i = 0; i < 72; i++) { const a = i / 72 * Math.PI * 2, l = i % 6 === 0 ? 34 : 14; x.strokeStyle = i % 6 === 0 ? "#2dd4ff" : "rgba(45,212,255,.55)"; x.shadowColor = "#2dd4ff"; x.lineWidth = i % 6 === 0 ? 4 : 2; x.beginPath(); x.moveTo(Math.cos(a) * 430, Math.sin(a) * 430); x.lineTo(Math.cos(a) * (430 - l), Math.sin(a) * (430 - l)); x.stroke(); }
    arc(380, 0.3, 2.4, 3, "rgba(255,59,122,.9)"); arc(380, 3.6, 5.4, 3, "rgba(45,212,255,.9)"); arc(330, 0, Math.PI * 2, 1.5, "rgba(45,212,255,.35)");
    x.fillStyle = "#2dd4ff"; x.font = "bold 24px ui-monospace,monospace"; x.textAlign = "center"; x.shadowBlur = 8; x.fillText("Z E R O  ·  L I N K", 0, -486 + 0);

  })();
  const ringMat = (op) => new T.MeshBasicMaterial({ map: ringTex, transparent: true, opacity: op, blending: T.AdditiveBlending, depthWrite: false, side: T.DoubleSide, toneMapped: false });
  const hudBack = new T.Mesh(new T.PlaneGeometry(4.0, 4.0), ringMat(0.55)); hudBack.position.set(0, 1.05, -0.9); hudBack.renderOrder = -1; body.add(hudBack);
  const hudRingMat = ringMat(0.6);
  const hudFlat = new T.Mesh(new T.RingGeometry(1.55, 1.62, 96), bm(CYAN, 1.4, { transparent: true, opacity: 0.5, side: T.DoubleSide, depthWrite: false, blending: T.AdditiveBlending }));

  const hudFlat2 = new T.Mesh(new T.RingGeometry(1.8, 1.83, 96, 1, 0, Math.PI * 1.4), bm(PINK, 1.4, { transparent: true, opacity: 0.6, side: T.DoubleSide, depthWrite: false, blending: T.AdditiveBlending }));
  hudFlat2.rotation.x = Math.PI / 2 - 0.25; hudFlat2.position.set(0, 0.85, 0); body.add(hudFlat2);

  /* ---- tint (state) ---- */
  const glowCol = new T.Color(CYAN);
  Z.onState = () => { drawSkull(Z.expr); };
  Z.onExpr = () => { drawSkull(Z.expr); };

    if (e.target.closest && e.target.closest("button,input,a")) return;

/* ---------- boot ---------- */
function onTap() { if (!greeted) greet(); }
// when 3D isn't running, a tap on the page still wakes Zero
stage.addEventListener("click", () => { if (!Z.gl) onTap(); });

document.addEventListener("pointerup", (e) => { if (!greeted && e.target.closest && e.target.closest("#mic")) return; }, true);

const rafShared = (() => { let last = performance.now(); return function loop(ms) { if (!Z.gl) { tickShared(ms, Math.min(0.05, (ms - last) / 1000)); } last = ms; requestAnimationFrame(loop); }; })();
