<style>
:root{--cyan:#BDB0F2;--pink:#6842CD;--mag:#8A6FE0;--bg:#07040d;--glow:var(--cyan);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#E9E6F4;overflow:hidden;overscroll-behavior:none;
  font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage{position:fixed;inset:0;height:100dvh;touch-action:none;background:radial-gradient(120% 90% at 50% 35%,#120c26 0%,#07040d 70%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .8s}
#stage.live #gl{opacity:1}
/* still-image fallback / poster */
#still{position:absolute;left:50%;top:6%;width:min(100vw,66dvh);aspect-ratio:1;transform:translateX(-50%);transition:opacity .8s;pointer-events:none}
#still img{width:100%;height:100%;display:block;object-fit:cover;border-radius:18px;animation:breathe 5s ease-in-out infinite;-webkit-mask-image:radial-gradient(closest-side,#000 78%,transparent 100%);mask-image:radial-gradient(closest-side,#000 78%,transparent 100%)}
#stage.live #still{opacity:0}
#eyeGlow{position:absolute;left:50%;top:27%;width:46%;height:16%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--glow) 55%,transparent),transparent 75%);mix-blend-mode:screen;opacity:.45;animation:pulse 2.6s ease-in-out infinite}
#stage.talking #eyeGlow{animation:none;opacity:.85}
@keyframes breathe{50%{transform:scale(1.02) translateY(-1%)}}
@keyframes pulse{50%{opacity:.8}}
/* scanline + vignette */
#scan{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.12;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
#scan::after{content:"";position:absolute;left:0;right:0;height:22%;top:-25%;background:linear-gradient(180deg,transparent,rgba(104,66,205,.07),transparent);animation:sweep 7s linear infinite}
@keyframes sweep{to{top:110%}}
#vig{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(120% 100% at 50% 40%,transparent 55%,rgba(0,0,0,.5) 100%)}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(var(--sat) + 10px) 14px 0;display:flex;gap:10px;justify-content:space-between;pointer-events:none}
.panel{background:rgba(10,6,20,.66);border:1px solid color-mix(in srgb,var(--glow) 55%,transparent);border-radius:10px;padding:7px 10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:0 0 14px color-mix(in srgb,var(--glow) 25%,transparent)}
#hudL{min-width:150px}
#hudL b{letter-spacing:.2em;color:var(--glow);font-size:14px}
#hudL .st{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:11px}
#dot{width:8px;height:8px;border-radius:50%;background:var(--glow);box-shadow:0 0 8px var(--glow);animation:pulse 2s infinite}
#hudL .row{color:#9a93b8;font-size:10.5px;white-space:nowrap}
#hudL .row i{font-style:normal;color:#E9E6F4}
#hudR{display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid color-mix(in srgb,var(--glow) 55%,transparent);background:rgba(10,6,20,.66);color:var(--glow);font-size:17px;display:grid;place-items:center;text-decoration:none;cursor:pointer;padding:0}
.ib[aria-pressed=true]{color:#667}
/* bottom dock */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 12px calc(var(--sab) + 10px);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#bubble{pointer-events:auto;max-width:min(94vw,520px);width:100%;min-height:0;display:none}
#bubble.show{display:block}
#bubble .panel{font-size:14px;line-height:1.4;color:#EEEAFB}
#bubble .who{display:block;font-size:10px;letter-spacing:.2em;color:var(--glow);margin-bottom:3px}
#bubble .acts{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;color:#07040d;background:var(--glow);border:0;border-radius:999px;padding:7px 14px;font-weight:700;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--glow);border:1px solid var(--glow)}
#wave{width:min(94vw,520px);height:34px;display:block;opacity:.9}
#bar{pointer-events:auto;display:flex;gap:8px;width:min(94vw,520px);align-items:center}
#q{flex:1;min-width:0;height:44px;border-radius:22px;border:1px solid color-mix(in srgb,var(--glow) 55%,transparent);background:rgba(10,6,20,.72);color:#EEEAFB;padding:0 16px;font:16px ui-monospace,Menlo,monospace;outline:none;-webkit-user-select:text;user-select:text}
#q::placeholder{color:#756e92}
#mic{width:64px;height:64px;border-radius:50%;border:2px solid var(--glow);background:radial-gradient(circle,color-mix(in srgb,var(--glow) 26%,#07040d),#07040d);color:var(--glow);font-size:26px;display:grid;place-items:center;flex:none;touch-action:none;cursor:pointer;padding:0;
  box-shadow:0 0 18px color-mix(in srgb,var(--glow) 40%,transparent);-webkit-user-select:none}
#mic.rec{background:#4a2fa0;border-color:#8a73e6;color:#f1edff;box-shadow:0 0 22px #5a3fc0;transform:scale(1.1)}
#send{height:44px;padding:0 14px;flex:none}
#wake{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 158px);text-align:center;z-index:6;pointer-events:none;letter-spacing:.25em;font-size:12px;color:var(--glow);text-shadow:0 0 10px var(--glow);animation:pulse 1.6s infinite}
#wake.hide{display:none}
#hint{font-size:10.5px;color:#756e92;text-align:center;pointer-events:none;letter-spacing:.04em}
@media (prefers-reduced-motion:reduce){#scan::after,#still img,#dot,#wake{animation:none}}
@media (min-width:700px){#hud{padding-left:24px;padding-right:24px}}
</style>

<body>
<div id="stage" aria-label="Zero, 3D avatar">
  <div id="still"><img src="zero-avatar-sq.jpg" alt="Zero: a skull-headed figure in a black suit, violet light and glowing pale eyes" decoding="async"><div id="eyeGlow"></div></div>
  <canvas id="gl"></canvas>
</div>
<div id="vig"></div><div id="scan"></div>

<div id="hud">
  <div id="hudL" class="panel">
    <b>ZERO</b>
    <div class="st"><span id="dot"></span><span id="stText">LINKING…</span></div>
    <div class="row">notes <i id="hNotes">--</i> · open <i id="hOpen">--</i></div>
    <div class="row">agents <i id="hAgents">--</i> · data <i id="hAge">--</i></div>
  </div>
  <div id="hudR">
    <button class="ib" id="mute" aria-label="Mute voice" aria-pressed="false">🔊</button>
    <a class="ib" id="appLink" href="./" aria-label="Open Agent Home">⌂</a>
  </div>
</div>

<div id="wake">TAP TO WAKE ZERO</div>
<div id="dock">
  <div id="bubble" aria-live="polite"></div>
  <canvas id="wave" width="520" height="34"></canvas>
  <div id="bar">
    <input id="q" type="text" enterkeyhint="send" autocomplete="off" autocorrect="off" autocapitalize="sentences" placeholder="Ask Zero…" aria-label="Ask Zero">
    <button class="btn" id="send">Send</button>
    <button id="mic" aria-label="Hold to talk">🎙</button>
  </div>
  <div id="hint">hold 🎙 to talk · or type · drag to spin · pinch to zoom</div>
</div>

<script>
/* ============================================================
   ZERO — standalone 3D avatar + voice. Public data only.
   Reads: brain-widget.json (same folder) and live.json (agent-home-web) and gem-x.json (X Radar).
   No private files, no accounts, no P&L, no trading. Nothing is ever sent anywhere from this page.
   ============================================================ */
"use strict";
const BASE = new URL("./", location.href).href;
const URL_BW = BASE + "brain-widget.json";
const URL_GX = BASE + "gem-x.json";
const URL_INS = BASE + "brain-insights.json";
const URL_KB = BASE + "zero-kb.json";
const URL_LIVE = "https://elpsjerome158-arch.github.io/agent-home-web/StreamingAssets/AgentHome/live.json";
const $ = (id) => document.getElementById(id);
const stage = $("stage");
const DAY = 86400;

/* ---------- shared state (read by the 3D loop) ---------- */
const Z = { talk: 0, speaking: false, pulse: 0, expr: "neutral", stale: false, fresh: true, woke: false, muted: false,
            data: null, intent: null, onExpr: null, onState: null, simTalkUntil: 0, fx: null, sleeping: false, lastAct: performance.now() };

/*SUM:START*/
/* ---------- data (public only) ---------- */
async function getJSON(u) {
  try { const r = await fetch(u + (u.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" }); if (!r.ok) throw 0; return await r.json(); }
  catch (e) { return null; }
}
const num = (x) => (Number.isFinite(+x) && x !== null ? +x : 0);
function ageSec(iso, ts) {
  if (ts) return Math.max(0, Date.now() / 1000 - ts);
  const t = Date.parse(iso || ""); return Number.isFinite(t) ? Math.max(0, (Date.now() - t) / 1000) : null;
}
function ageWords(s) {
  if (s == null) return "unknown age";
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + " minutes";
  if (s < DAY) { const h = Math.round(s / 3600); return h + (h === 1 ? " hour" : " hours"); }
  const d = Math.round(s / DAY); return d + (d === 1 ? " day" : " days");
}
function ageShort(s) { if (s == null) return "--"; return s < 3600 ? Math.max(1, Math.round(s / 60)) + "m" : s < DAY ? Math.round(s / 3600) + "h" : Math.round(s / DAY) + "d"; }
const PRETTY = { "perps-market-scout": "Market Scout", "trade-journal-bot": "Trade Journal", "wallet-watch": "Wallet Watch", "gem-search": "Gem Search" };
const prettyId = (id) => PRETTY[id] || String(id || "agent").replace(/[-_]+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());

function summarize(bw, live, gx, ins) {
  const sb = (bw && bw.second_brain) || {}, pl = (bw && bw.pipeline) || {}, nr = (bw && bw.neural) || {};
  const lines = (live && Array.isArray(live.agent_status_lines)) ? live.agent_status_lines : [];
  const finds = (gx && Array.isArray(gx.finds)) ? gx.finds.slice() : [];
  finds.sort((a, b) => num(b.score) - num(a.score) || num(b.mentions) - num(a.mentions));
  const liveAge = ageSec(live && live.updated_iso);
  const brainAge = ageSec(null, nr.newest_ts || sb.newest_ts);
  const gxAge = ageSec(gx && gx.scanned_at_iso);
  const ages = [liveAge, brainAge].filter((x) => x != null);
  const dataAge = live ? liveAge : (ages.length ? Math.min.apply(null, ages) : null); // freshness is driven by the live feed
  return {
    ok: !!(bw || live || gx), haveBW: !!bw, haveLive: !!live, haveGX: !!gx,
    notes: num(sb.notes), folders: num(sb.folders), links: num(sb.links), topics: num(sb.topics), attention: num(sb.attention), rules: num(sb.rules),
    nodes: num(nr.nodes), agentsGraph: num(nr.agents), memory: num(nr.memory),
    open: num(pl.open), decided: num(pl.decided), decisions: num(pl.decisions), gate: pl.gate == null ? null : num(pl.gate), gapS: pl.median_gap_s == null ? null : num(pl.median_gap_s),
    questions: num(pl.questions), cases: Array.isArray(pl.cases) ? pl.cases.length : 0,
    agents: lines.length, agentsLive: lines.filter((l) => l && l.line && l.line !== "private").length,
    agentNames: lines.filter((l) => l && l.line && l.line !== "private").map((l) => prettyId(l.id)),
    finds: finds.slice(0, 5).map((f) => ({ ticker: String(f.ticker || "").replace(/[^A-Za-z0-9$]/g, "").slice(0, 12), score: num(f.score), mentions: num(f.mentions), authors: num(f.authors), flags: (Array.isArray(f.flags) ? f.flags : []).slice(0, 3).map(cleanFlag).filter(Boolean) })).filter((f) => f.ticker),
    gxAge, liveAge, brainAge, dataAge,
    nlinks: num(nr.links), scanCt: gx && gx.scanned_at_ct ? String(gx.scanned_at_ct).replace(/[^0-9A-Za-z :-]/g, "").slice(0, 24) : "", posts: num(gx && gx.posts_read),
    builtCt: bw && bw.built_ct ? String(bw.built_ct).replace(/[^0-9A-Za-z :,-]/g, "").slice(0, 24) : "", liveCt: live && live.updated_ct ? String(live.updated_ct).replace(/[^0-9A-Za-z :,-]/g, "").slice(0, 28) : "",
    market: marketOf(live), ins: cleanInsights(ins), lines: lines.map((l) => ({ id: String(l && l.id || ""), line: String(l && l.line || "") })),
    stale: dataAge == null ? true : dataAge > DAY,
  };
}
function marketOf(live) {
  const sc = (live && live.scout) || {}, mk = {};
  for (const s of ["SOL", "BTC", "ETH"]) { const m = Number(sc[s.toLowerCase() + "_mark"]), c = Number(sc[s.toLowerCase() + "_chg_24h_pct"]); if (Number.isFinite(m) && m > 0 && Number.isFinite(c)) mk[s] = { mark: m, chg: c }; }
  return mk;
}
/*SUM:END*/
let dataPromise = null;
async function loadData() {
  const [bw, live, gx, ins] = await Promise.all([getJSON(URL_BW), getJSON(URL_LIVE), getJSON(URL_GX), getJSON(URL_INS)]);
  const d = summarize(bw, live, gx, ins);
  if (d.ok) { try { const sc = (live && live.scout) || {}; const mk = {}; ["sol", "btc", "eth"].forEach((k) => { mk[k + "_mark"] = sc[k + "_mark"]; mk[k + "_chg_24h_pct"] = sc[k + "_chg_24h_pct"]; }); localStorage.setItem("zero.cache.v1", JSON.stringify({ bw, live: live && { updated_iso: live.updated_iso, updated_ct: live.updated_ct, agent_status_lines: live.agent_status_lines, scout: mk }, gx: gx && { scanned_at_iso: gx.scanned_at_iso, scanned_at_ct: gx.scanned_at_ct, posts_read: gx.posts_read, finds: gx.finds && gx.finds.slice(0, 8).map((f) => ({ ticker: f.ticker, score: f.score, mentions: f.mentions, authors: f.authors, flags: f.flags })) }, ins: ins && { insights: (ins.insights || []).slice(0, 8).map((x) => ({ text: x.text, source: x.source, priority: x.priority })) } })); } catch (e) {} }
  else { try { const c = JSON.parse(localStorage.getItem("zero.cache.v1") || "null"); if (c) { const dd = summarize(c.bw, c.live, c.gx, c.ins); dd.cached = true; return dd; } } catch (e) {} }
  return d;
}
function applyData(d) {
  Z.data = d; Z.stale = !!d.stale; Z.fresh = d.ok && !d.stale;
  const root = document.documentElement.style;
  root.setProperty("--glow", Z.stale || !d.ok ? "#8A82B8" : "#BDB0F2");
  $("stText").textContent = !d.ok ? "OFFLINE" : (Z.stale ? "STALE · " + ageShort(d.dataAge) : "ONLINE") + (d.cached ? " · cached" : "");
  $("hNotes").textContent = d.haveBW || d.cached ? d.notes : "--"; $("hOpen").textContent = d.haveBW || d.cached ? d.open : "--";
  $("hAgents").textContent = d.agents || "--"; $("hAge").textContent = ageShort(d.dataAge);
  if (Z.onState) Z.onState();
}
function refresh() { dataPromise = loadData().then((d) => { applyData(d); return d; }); return dataPromise; }

/* ---------- voice out ---------- */
const synth = ("speechSynthesis" in window) ? window.speechSynthesis : null;
let voice = null;
function pickVoice() {
  if (!synth) return;
  const vs = synth.getVoices().filter((v) => /^en/i.test(v.lang));
  if (!vs.length) return;
  const prefs = [/daniel/i, /arthur/i, /aaron/i, /rishi/i, /oliver/i, /gordon/i, /fred/i, /alex/i, /google uk english male/i, /\bmale\b/i, /david|mark|james|george|guy|ryan|thomas/i];
  for (const p of prefs) { const v = vs.find((x) => p.test(x.name)); if (v) { voice = v; return; } }
  voice = vs.find((v) => /en-GB/i.test(v.lang)) || vs.find((v) => /en-US/i.test(v.lang)) || vs[0];
}
if (synth) { pickVoice(); try { synth.addEventListener("voiceschanged", pickVoice); } catch (e) { synth.onvoiceschanged = pickVoice; } }

let speakTok = 0;
function sentences(t) { return (t.match(/[^.!?]+[.!?]*/g) || [t]).map((s) => s.trim()).filter(Boolean); }
function setExpr(e) { Z.expr = e || "neutral"; if (Z.onExpr) Z.onExpr(Z.expr); }
function speakText(text, expr, opts) {
  opts = opts || {};
  const tok = ++speakTok;
  Z.lastAct = performance.now();
  setExpr(expr);
  if (!opts.noBubble) bubble(text, opts.actions);
  const start = () => { Z.speaking = true; stage.classList.add("talking"); };
  const stop = () => { if (tok === speakTok) { Z.speaking = false; stage.classList.remove("talking"); Z.pulse = 0; } };
  if (!synth || Z.muted || !Z.woke) {            // silent mode: still animate the jaw for roughly the reading time
    Z.simTalkUntil = performance.now() + Math.min(9000, text.length * 55); start();
    setTimeout(() => { if (tok === speakTok && performance.now() >= Z.simTalkUntil - 50) stop(); }, Math.min(9000, text.length * 55) + 60);
    return;
  }
  try { synth.cancel(); } catch (e) {}
  const parts = sentences(text);
  parts.forEach((s, i) => {
    const u = new SpeechSynthesisUtterance(s);
    if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = "en-GB";
    u.pitch = 0.62; u.rate = 0.96; u.volume = 1;
    u.onstart = () => { if (tok === speakTok) start(); };
    u.onboundary = (ev) => { if (tok === speakTok && (!ev.name || ev.name === "word")) Z.pulse = 1; };
    u.onend = () => { if (i === parts.length - 1) stop(); };
    u.onerror = () => { if (i === parts.length - 1) stop(); };
    synth.speak(u);
  });
  Z.simTalkUntil = performance.now() + 400; // covers the gap before onstart; real speech keeps `speaking` true
  start();
  setTimeout(() => { if (tok === speakTok && synth && !synth.speaking && !synth.pending) stop(); }, 1500);
}
/* unlock iOS audio inside a user gesture */
function unlockAudio() {
  if (Z.woke) return;
  Z.woke = true; $("wake").classList.add("hide");
  if (synth) { try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; synth.speak(u); } catch (e) {} }
}

/* ---------- bubble ---------- */
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function bubble(text, actions) {
  const b = $("bubble"); b.classList.add("show");
  b.innerHTML = '<div class="panel"><span class="who">ZERO</span>' + esc(text) + '<div class="acts"></div></div>';
  const acts = b.querySelector(".acts");
  (actions || []).forEach((a) => {
    const el = document.createElement(a.href ? "a" : "button");
    el.className = "btn" + (a.ghost ? " ghost" : ""); el.textContent = a.label;
    if (a.href) { el.href = a.href; } else el.addEventListener("click", a.fn);
    acts.appendChild(el);
  });
  if (!actions || !actions.length) acts.remove();
}
function userBubble(t) { /* echo of what Zero heard goes in the input placeholder to keep the dock small */ $("q").value = ""; $("q").placeholder = "“" + t.slice(0, 60) + "”"; }

/* ---------- greeting ---------- */
function daypart() { const h = new Date().getHours(); return h < 5 ? "Late night" : h < 12 ? "Morning" : h < 17 ? "Afternoon" : "Evening"; }
function radarPhrase(d) {
  if (!d.haveGX) return "X Radar is unreachable";
  return d.gxAge > DAY ? "X Radar is " + ageWords(d.gxAge) + " stale" : "X Radar is fresh, scanned " + ageWords(d.gxAge) + " ago";
}
function greetingText(d) {
  const head = daypart() + ", Jerome. Zero online.";
  if (!d || !d.ok) return head + " I can't reach my data feeds right now.";
  const bits = [];
  if (d.haveLive) bits.push(d.agents + " agents online");
  if (d.haveGX) bits.push(radarPhrase(d));
  else if (d.haveBW) bits.push(d.notes + " notes in the second brain");
  return head + (bits.length ? " " + bits.join(", ") + "." : "");
}
let greeted = false;
function greet() {
  if (greeted) return; greeted = true;
  unlockAudio();
  const d = Z.data;
  if (d) { speakText(greetingText(d), Z.stale ? "sleepy" : "happy"); return; }
  speakText("Zero online.", "neutral");                      // inside the gesture; the details follow when data lands
  (dataPromise || refresh()).then((dd) => { setTimeout(() => speakText(greetingText(dd), Z.stale ? "sleepy" : "happy"), 900); });
}

/*ZK:START*/
/* Zero's local question matcher. Pure functions, no DOM. Reads zero-kb.json (public). */
const ZK = (function () {
  const COMMON = new Set("thing think time good make made need show tell take took want know look looks looking go going gone come came use used using find found see seen say said work works done doing does do day days week weeks month year today tonight tomorrow yesterday now soon later again always never maybe sure really actually little lot lots big small long short high low new old fast slow right left back front side home house place name word words people person man woman kid kids friend friends money world life hand head eye eyes face water food story stuff idea ideas problem question questions answer answers mean means meant thought looks lets help helps helped".split(" "));
  const stripE = (w) => (w.length > 5 && /[^aeiou]e$/.test(w) ? w.slice(0, -1) : w);
  function stem(w) {
    if (w.length <= 3 || /\d/.test(w)) return w;
    let s = w;

/* ---------- boot ---------- */
const tapTimes = [];
function startFx(k, ms) { Z.fx = { k, until: performance.now() + ms }; }
function poke() {
  startFx("annoyed", 3200);
  speakText(["Hey. The skull is not a button.", "Okay, okay. Stop poking my head.", "I felt that. Twice."][Math.floor(Math.random() * 3)], "annoyed");
  setTimeout(() => { if (Z.expr === "annoyed") setExpr("neutral"); }, 3400);
}
function onTap() {
  const now = performance.now(); tapTimes.push(now); while (tapTimes.length && now - tapTimes[0] > 2200) tapTimes.shift();

  if (tapTimes.length >= 3) { tapTimes.length = 0; poke(); return; }   // rapid pokes -> annoyed

}
// idle sleep: any touch / key / typing counts as activity and wakes Zero
const act = () => { if (Z.sleeping) startFx("surprised", 800); Z.lastAct = performance.now(); };
["pointerdown", "keydown", "touchstart"].forEach((ev) => document.addEventListener(ev, act, { passive: true, capture: true }));
$("q").addEventListener("input", () => { Z.lastAct = performance.now(); });
// when 3D isn't running, a tap on the page still wakes Zero
